<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almara · El arte de vestir bien</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Pinyon+Script&display=swap">
<style>
:root{
  color-scheme:light;
  --crema:#fbeee8; --rosa:#e8bfc4; --rosa-oro:#c98f86; --azul:#4a5780; --azul-osc:#2f3961;
  --grad:linear-gradient(135deg,#b97a74,#f1cfc4 45%,#c98f86 70%,#f6dcd2);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;display:flex;justify-content:center;background:#3a4570;font-family:'Cinzel',serif;color:var(--crema)}
main{
  width:100%;max-width:480px;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2.4rem 0 0;
  background:
    radial-gradient(ellipse at 85% 8%,rgba(246,220,210,.45),transparent 55%),
    radial-gradient(ellipse at 10% 95%,rgba(232,191,196,.45),transparent 55%),
    linear-gradient(165deg,#3f4a78 0%,#566696 32%,#7a6f98 58%,#a9788a 82%,#8e5a66 100%);
}
.logo{display:flex;flex-direction:column;align-items:center;width:100%;padding:0 1.5rem}
.logo img{display:block;max-width:100%;height:auto}
.mark{width:46%} .name{width:86%;margin-top:.6rem} .tag{width:62%;margin-top:.7rem}
h1{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(2.2rem,10vw,2.9rem);margin:2rem 0 .1rem;text-align:center;line-height:1.1;color:var(--crema);text-shadow:0 2px 10px rgba(47,57,97,.5)}
.sub{margin:8rem 0 1.6rem;font-size:.95rem;letter-spacing:.08em;color:var(--rosa)}
nav{width:calc((100% - 3rem) * .86);padding:0;display:flex;flex-direction:column;gap:1rem}
.btn{position:relative;display:flex;align-items:center;min-height:3.4rem;border-radius:999px;text-decoration:none;border:2px solid transparent;
  background:linear-gradient(var(--crema),var(--crema)) padding-box,var(--grad) border-box;
  letter-spacing:.18em;color:var(--azul-osc);font-size:1rem;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(30,36,70,.35)}
.btn:focus-visible{outline:3px solid var(--crema);outline-offset:3px}
.ico{flex:none;width:3.2rem;height:3.2rem;margin:-2px 0 -2px -2px;border-radius:50%;background:linear-gradient(135deg,#a8636d,#d99a96 55%,#b97a74);display:grid;place-items:center}
.ico svg{width:1.6rem;height:1.6rem;stroke:#fff3ee;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn b{flex:1;text-align:center;font-weight:500;padding-right:3rem}
footer{margin-top:auto;padding:2.5rem 0 1.5rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;width:100%}
footer .mark{width:12%} footer .tag{width:56%;margin-top:0}
</style>
</head>
